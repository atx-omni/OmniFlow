name: Test

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: test-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install development dependencies
        run: |
          python -m pip install --disable-pip-version-check --no-input --upgrade "pip==26.1.2"
          python -m pip install --disable-pip-version-check --no-input -e ".[dev]"

      - name: Lint
        run: ruff check .

      - name: Unit tests
        run: pytest --cov=omniflow --cov-report=term-missing

      - name: Security lint
        run: bandit -c pyproject.toml -r src

      - name: Alpha simulation
        if: matrix.python-version == '3.12'
        run: python scripts/simulate_alpha.py

  package:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: "3.12"

      - name: Build and inspect distributions
        run: |
          python -m pip install --disable-pip-version-check --no-input --upgrade "pip==26.1.2"
          python -m pip install --disable-pip-version-check --no-input ".[dev]"
          python -m build
          twine check dist/*

      - name: Verify wheel installation
        run: |
          python -m venv /tmp/omniflow-wheel-test
          /tmp/omniflow-wheel-test/bin/python -m pip install --disable-pip-version-check --no-input dist/*.whl
          /tmp/omniflow-wheel-test/bin/omniflow --version
