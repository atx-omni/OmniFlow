name: OmniFlow
description: Security-first validation for Omni semantic-layer changes.
inputs:
  config:
    description: Path to .omniflow.yml
    required: false
    default: .omniflow.yml
  version:
    description: Optional PyPI version of omniflow to install. Leave empty to install from the pinned action checkout.
    required: false
    default: ""
runs:
  using: composite
  steps:
    - name: Install OmniFlow
      shell: bash
      run: |
        if [ -n "${{ inputs.version }}" ]; then
          python -m pip install "omniflow==${{ inputs.version }}"
        else
          python -m pip install "$GITHUB_ACTION_PATH"
        fi

    - name: Skip unsafe fork PR
      if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository
      shell: bash
      run: |
        mkdir -p .omniflow/public
        printf '{"policy_decision":"skipped","reason":"Fork pull request cannot access OMNI_API_KEY safely."}\n' > .omniflow/report.json
        printf '# OmniFlow\n\nFork pull request skipped because secrets are not available safely.\n' > .omniflow/report.md
        cp .omniflow/report.json .omniflow/public/report.json
        cp .omniflow/report.md .omniflow/public/report.md

    - name: Run OmniFlow
      if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
      shell: bash
      run: omniflow run --auto --config "${{ inputs.config }}"
