name: OmniFlow
description: Security-first validation for Omni semantic-layer changes.
inputs:
  config:
    description: Path to .omniflow.yml
    required: false
    default: .omniflow.yml
  version:
    description: Optional PyPI version of omniflow-ci to install. Leave empty to install from the pinned action checkout.
    required: false
    default: ""
  skip-reason:
    description: Record a successful skipped run without exposing the Omni API key.
    required: false
    default: ""
runs:
  using: composite
  steps:
    - name: Install OmniFlow
      shell: bash
      env:
        OMNIFLOW_INPUT_VERSION: ${{ inputs.version }}
      run: |
        set -euo pipefail
        python -m pip install --disable-pip-version-check --no-input --upgrade "pip==26.1.2" "setuptools==83.0.0"
        if [ -n "$OMNIFLOW_INPUT_VERSION" ]; then
          python -m pip install --disable-pip-version-check --no-input "omniflow-ci==$OMNIFLOW_INPUT_VERSION"
        else
          python -m pip install --disable-pip-version-check --no-input "$GITHUB_ACTION_PATH"
        fi

    - name: Record skipped run
      if: inputs['skip-reason'] != ''
      shell: bash
      env:
        OMNIFLOW_INPUT_CONFIG: ${{ inputs.config }}
        OMNIFLOW_INPUT_SKIP_REASON: ${{ inputs['skip-reason'] }}
      run: |
        set -euo pipefail
        omniflow run --auto --config "$OMNIFLOW_INPUT_CONFIG" \
          --skip-reason "$OMNIFLOW_INPUT_SKIP_REASON"

    - name: Run OmniFlow
      if: inputs['skip-reason'] == ''
      shell: bash
      env:
        OMNIFLOW_INPUT_CONFIG: ${{ inputs.config }}
        OMNIFLOW_GITHUB_TOKEN: ${{ github.token }}
      run: |
        set -euo pipefail
        omniflow run --auto --config "$OMNIFLOW_INPUT_CONFIG"
