name: OmniFlow
description: Security-first validation for Omni semantic-layer changes.
inputs:
  config:
    description: Path to .omniflow.yml
    required: false
    default: .omniflow.yml
  omni-api-key:
    description: Dedicated least-privilege Omni personal access token. Exposed only to the validation step.
    required: false
  skip-reason:
    description: Record a successful skipped run without exposing the Omni API key.
    required: false
    default: ""
runs:
  using: composite
  steps:
    - name: Install OmniFlow
      shell: bash
      env:
        PIP_DISABLE_PIP_VERSION_CHECK: "1"
        PIP_NO_INPUT: "1"
      run: |
        set -euo pipefail
        python - <<'PY'
        import platform
        import sys

        supported = sys.version_info[:2] == (3, 11) and platform.system() == "Linux" and platform.machine() == "x86_64"
        if not supported:
            raise SystemExit("OmniFlow's locked action runtime requires Linux x86_64 with Python 3.11")
        PY
        python -m pip install --require-hashes --only-binary=:all: \
          --requirement "$GITHUB_ACTION_PATH/requirements/action-py311-linux-x86_64.txt"
        PIP_NO_INDEX=1 python -m pip install --no-deps --no-build-isolation "$GITHUB_ACTION_PATH"
        python -m pip check

    - name: Record skipped run
      if: inputs['skip-reason'] != ''
      shell: bash
      env:
        OMNIFLOW_INPUT_CONFIG: ${{ inputs.config }}
        OMNIFLOW_INPUT_SKIP_REASON: ${{ inputs['skip-reason'] }}
      run: |
        set -euo pipefail
        omniflow run --auto --config "$OMNIFLOW_INPUT_CONFIG" \
          --skip-reason "$OMNIFLOW_INPUT_SKIP_REASON"

    - name: Run OmniFlow
      if: inputs['skip-reason'] == ''
      shell: bash
      env:
        OMNI_API_KEY: ${{ inputs['omni-api-key'] }}
        OMNIFLOW_INPUT_CONFIG: ${{ inputs.config }}
        OMNIFLOW_GITHUB_TOKEN: ${{ github.token }}
      run: |
        set -euo pipefail
        omniflow run --auto --config "$OMNIFLOW_INPUT_CONFIG"
